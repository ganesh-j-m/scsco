```html
<!doctype html>
<html lang="en">

<head>
  <!-- HTML document ची सुरुवात आणि HTML5 version -->
  <meta charset="UTF-8" />
  <!-- सर्वसाधारण अक्षरे योग्य दिसण्यासाठी UTF-8 encoding -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Website mobile, tablet आणि desktop वर योग्य दिसण्यासाठी -->

  <meta name="description" content="Shri Chhatrapati Shivaji College, Omerga - official digital platform" />
  <!-- Search engine साठी website चे थोडक्यात वर्णन -->

  <meta name="theme-color" content="#194f8c" />
  <!-- Supported mobile browsers च्या browser bar साठी theme color -->

  <title>SCSCO - Shri Chhatrapati Shivaji College, Omerga</title>
  <!-- Browser tab मध्ये दिसणारे website चे नाव -->

  <!-- College logo browser tab मध्ये favicon म्हणून दाखवण्यासाठी -->
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

  <!-- Google Fonts शी connection लवकर तयार करण्यासाठी -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Website मध्ये Poppins font वापरण्यासाठी -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- React website render होण्यासाठी मुख्य container -->
  <div id="root"></div>

  <!-- JavaScript बंद असल्यास user ला दाखवला जाणारा संदेश -->
  <noscript>Please enable JavaScript to use the SCSCO platform.</noscript>

  <!-- React application सुरू करणारी मुख्य TypeScript file -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
```
